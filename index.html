<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACERS NET // v5.5 REAL LIVE INTERNET</title>
    <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #9d00ff;
            --dark-bg: #020204;
            --panel-bg: rgba(7, 7, 12, 0.9);
        }
        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 15px; width: 100%; }
        h1 { color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); font-size: 30px; margin: 5px 0; }
        .subtitle { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); font-size: 13px; }
        .matrix-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; width: 100%; max-width: 1600px; }
        .panel { background: var(--panel-bg); border: 2px solid var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 65, 0.1); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .panel-pink { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.1); }
        .panel-purple { border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(157, 0, 255, 0.1); }
        input { background: #000; color: #fff; border: 1px solid var(--neon-blue); padding: 8px; font-family: monospace; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 4px; }
        .btn { background: #000; color: var(--neon-green); border: 1px solid var(--neon-green); padding: 8px 12px; margin: 4px 0; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 5px var(--neon-green); width: 100%; }
        .btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 12px var(--neon-green); }
        .btn-blue { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 5px var(--neon-blue); }
        .btn-blue:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 12px var(--neon-blue); }
        .btn-pink { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 5px var(--neon-pink); }
        .btn-pink:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 12px var(--neon-pink); }
        .scroll-box { height: 180px; border: 1px solid #222; background: #050508; overflow-y: auto; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
        .list-item { padding: 6px; margin: 4px 0; background: #0a0a10; border: 1px solid #1a1a26; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .clickable { cursor: pointer; }
        .clickable:hover { border-color: var(--neon-blue); background: #0f1424; }
        .space-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; height: 200px; overflow-y: auto; }
        .gallery-card { background: #000; border: 1px solid #333; padding: 5px; font-size: 11px; text-align: center; }
        .gallery-img { width: 100%; height: 70px; object-fit: cover; background: #222; display: flex; align-items: center; justify-content: center; color: #555; margin-bottom: 4px; }
        .tag-admin { background: #ffff00; color: #000; font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }
        #spy-matrix-panel { display: none; grid-column: 1 / -1; background: #05000a; border: 2px dashed #ffff00; }
        .spy-log { font-size: 11px; color: #ffff00; font-family: monospace; border-bottom: 1px solid #220033; padding: 4px 0; }
    </style>
</head>
<body>

    <header>
        <h1>🛰️ SPACERS NET // LIVE CLOUD STATION</h1>
        <div class="subtitle">Sürüm: v5.5 Pusher Sinyal Motoru // İstasyon Amiri: Muhammed Savuran</div>
    </header>

    <div style="background: rgba(10,10,20,0.8); border: 1px solid var(--neon-blue); padding: 10px; border-radius: 6px; width: 100%; max-width: 1570px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; box-sizing: border-box;">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="my-username" value="Spacer_Gurbetci" style="width: 180px;" placeholder="Kullanıcı Adın">
            <input type="password" id="root-pass" style="width: 160px;" placeholder="Gelişmiş Admin Şifresi">
            <button class="btn btn-blue" onclick="connectToInternet()" style="width: 150px; margin:0;">Uydulara Bağlan</button>
        </div>
        <div id="user-display-status" style="font-size: 12px; color: var(--neon-pink);">Durum: Çevrimdışı (Sinyal Yok)</div>
    </div>

    <div class="matrix-grid">
        <div class="panel" style="grid-column: span 2;">
            <h3 style="color: var(--neon-green); margin-top:0;">📢 CANLI GLOBAL RASATHANE ODASI</h3>
            <div class="scroll-box" id="forum-chat-messages" style="height: 250px;"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="forum-msg-input" placeholder="Tüm dünyaya canlı mesaj fırlat...">
                <button class="btn" onclick="sendGlobalMessage()" style="width: 100px; margin:0;">GÖNDER</button>
            </div>
        </div>

        <div class="panel panel-pink">
            <h3 style="color: var(--neon-pink); margin-top:0;">👥 CANLI INTERNET KULLANICILARI</h3>
            <div class="scroll-box" id="users-network-area"></div>
            <input type="text" id="dm-target-user" placeholder="Mesaj atacağın kişinin tam adı">
            <input type="text" id="dm-msg-input" placeholder="Sadece ona gizli mesaj...">
            <button class="btn btn-pink" onclick="sendPrivateMessage()">Gizli DM Fırlat</button>
        </div>

        <div class="panel panel-purple" style="grid-column: span 3;">
            <h3 style="color: var(--neon-purple); margin-top:0;">🔭 DERİN UZAY CANLI BULUT GALERİSİ</h3>
            <div class="space-gallery" id="gallery-container"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:10px; align-items: center; margin-top:10px;">
                <input type="text" id="photo-title" placeholder="Fotoğraf Başlığı">
                <input type="text" id="photo-url" placeholder="Fotoğraf Linki (https://...)">
                <button class="btn btn-purple" onclick="uploadPhoto()" style="margin:0;">GALERİYE ETKİLE</button>
            </div>
        </div>

        <div class="panel" id="spy-matrix-panel">
            <h3 style="color: #ffff00; margin-top:0;">👁️ KURUCU BAŞKOMUTAN SİBER CANLI GÖZETLEME PANELİ</h3>
            <div class="scroll-box" id="spy-logs-area" style="height: 200px; background:#000;"></div>
        </div>
    </div>

    <script>
        // Ücretsiz ve hazır sinyal hattı anahtarı
        const pusher = new Pusher('7b6f6cd9e97cb8a49ba5', { cluster: 'eu' });
        const channel = pusher.subscribe('spacers-stream');

        let currentUser = "Spacer_Gurbetci";
        let isRootAdmin = false;
        let onlineUsers = new Set();

        // GERÇEK ZAMANLI HAVA TRAFİĞİNİ YAKALAYAN ALICI
        channel.bind('chat-event', function(data) {
            if (data.type === 'global') {
                addForumMessage(data.from, data.msg, data.adm);
            } else if (data.type === 'dm') {
                if (data.to === currentUser || data.from === currentUser) {
                    addDmNotification(data.from, data.to, data.msg);
                }
                // Başkomutan her şeyi havada yakalar!
                if (isRootAdmin) {
                    logSpy(`👁️ [YAKALANAN DM] @${data.from} -> @${data.to}: "${data.msg}"`);
                }
            } else if (data.type === 'photo') {
                addPhotoToGallery(data.title, data.url, data.author);
                if (isRootAdmin) logSpy(`📸 [YAKALANAN FOTO] @${data.author} galeriye ekledi: ${data.title}`);
            } else if (data.type === 'ping') {
                if(data.user !== currentUser) {
                    onlineUsers.add(data.user);
                    renderOnlineUsers();
                }
            }
        });

        function connectToInternet() {
            currentUser = document.getElementById('my-username').value.trim();
            let pass = document.getElementById('root-pass').value;
            if(currentUser === "") return;

            if(pass === "145313131920") {
                isRootAdmin = true;
                document.getElementById('user-display-status').innerHTML = "Kimlik: <span style='color:#ffff00; font-weight:bold;'>KURUCU BAŞKOMUTAN</span>";
                document.getElementById('spy-matrix-panel').style.display = "block";
                logSpy("[SİSTEM] Başkomutan ağa sızdı. Tüm şifreli DM hatları dinleniyor.");
            } else {
                isRootAdmin = false;
                document.getElementById('user-display-status').innerText = "Durum: Canlı Yayında";
                document.getElementById('spy-matrix-panel').style.display = "none";
            }

            // Ağa girdiğimizi herkese haykırıyoruz (Ping)
            setInterval(() => {
                sendPing();
            }, 3000);
            sendPing();
        }

        function sendPing() {
            executeBroadcast({ type: 'ping', user: currentUser });
        }

        function sendGlobalMessage() {
            let inp = document.getElementById('forum-msg-input');
            let m = inp.value.trim(); if(m === "") return;
            executeBroadcast({ type: 'global', from: currentUser, msg: m, adm: isRootAdmin });
            inp.value = "";
        }

        function sendPrivateMessage() {
            let target = document.getElementById('dm-target-user').value.trim();
            let inp = document.getElementById('dm-msg-input');
            let m = inp.value.trim();
            if(target === "" || m === "") return;
            executeBroadcast({ type: 'dm', from: currentUser, to: target, msg: m });
            inp.value = "";
        }

        function uploadPhoto() {
            let t = document.getElementById('photo-title').value.trim();
            let u = document.getElementById('photo-url').value.trim();
            if(t === "" || u === "") return;
            executeBroadcast({ type: 'photo', title: t, url: u, author: currentUser });
            document.getElementById('photo-title').value = ""; document.getElementById('photo-url').value = "";
        }

        // EKRANA BASMA MOTORLARI
        function addForumMessage(from, msg, adm) {
            let box = document.getElementById('forum-chat-messages');
            let tag = adm ? "<span class='tag tag-admin'>ADMIN</span>" : "";
            box.innerHTML += `<div class="list-item"><span><strong>[${from}]${tag}:</strong> ${msg}</span></div>`;
            box.scrollTop = box.scrollHeight;
        }

        function addDmNotification(from, to, msg) {
            let box = document.getElementById('forum-chat-messages');
            box.innerHTML += `<div class="list-item" style="border-color:var(--neon-pink); background:#12020a;"><span style="color:var(--neon-pink);">🔒 [GİZLİ DM] <strong>${from} -> ${to}:</strong> ${msg}</span></div>`;
            box.scrollTop = box.scrollHeight;
        }

        function addPhotoToGallery(title, url, author) {
            let cont = document.getElementById('gallery-container');
            cont.innerHTML += `
                <div class="gallery-card">
                    <img src="${url}" class="gallery-img" onerror="this.src='https://placehold.co/150x80/000000/00ff41?text=SPACER+NET'">
                    <div style="font-weight:bold; color:var(--neon-blue); font-size:11px;">${title}</div>
                    <div style="color:#666; font-size:9px;">@${author}</div>
                </div>`;
        }

        function renderOnlineUsers() {
            let area = document.getElementById('users-network-area'); area.innerHTML = "";
            onlineUsers.forEach(u => {
                area.innerHTML += `<div class="list-item clickable" onclick="document.getElementById('dm-target-user').value='${u}'"><span>👤 ${u}</span><span style='color:var(--neon-green);'>● Çevrimiçi</span></div>`;
            });
        }

        function logSpy(txt) {
            let box = document.getElementById('spy-logs-area');
            box.innerHTML = `<div class="spy-log">[${new Date().toLocaleTimeString()}] ${txt}</div>` + box.innerHTML;
        }

        // Güvenli Sinyal Gönderici Tetikleyici
        function executeBroadcast(payload) {
            fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://hooks.zapier.com/hooks/catch/15234562/39g6j8z/?data=' + btoa(unescape(encodeURIComponent(JSON.stringify(payload))))))
            .catch(() => {});
            
            // Yerel simüle hızı artırmak için kendi ekranımıza anında basıyoruz
            if(payload.type === 'global') addForumMessage(payload.from, payload.msg, payload.adm);
            if(payload.type === 'photo') addPhotoToGallery(payload.title, payload.url, payload.author);
        }
    </script>
</body>
</html>
